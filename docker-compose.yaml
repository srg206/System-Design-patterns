services:
  kafka1:
    image: confluentinc/cp-kafka:latest
    container_name: kafka1
    hostname: kafka1
    env_file:
      - .env
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://localhost:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka1-data:/var/lib/kafka/data
    ports:
      - "9092:19092"
    networks:
      - kafka-net

  kafka2:
    image: confluentinc/cp-kafka:latest
    container_name: kafka2
    hostname: kafka2
    env_file:
      - .env
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,EXTERNAL://localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka2-data:/var/lib/kafka/data
    ports:
      - "9093:19092"
    networks:
      - kafka-net

  kafka3:
    image: confluentinc/cp-kafka:latest
    container_name: kafka3
    hostname: kafka3
    env_file:
      - .env
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,EXTERNAL://localhost:9094
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka3-data:/var/lib/kafka/data
    ports:
      - "9094:19092"
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-net

  init-scenario-postgres:
    image: postgres:16
    container_name: init-scenario-postgres
    ports:
      - "${INIT_SCENARIO_POSTGRES_PORT}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${INIT_SCENARIO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INIT_SCENARIO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${INIT_SCENARIO_POSTGRES_DB}
    volumes:
      - init_scenario_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  runner-postgres:
    image: postgres:16
    container_name: runner-postgres
    ports:
      - "${RUNNER_POSTGRES_PORT}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${RUNNER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RUNNER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RUNNER_POSTGRES_DB}
    volumes:
      - runner_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  runner-scheduler-postgres:
    image: postgres:16
    container_name: runner-scheduler-postgres
    ports:
      - "${RUNNER_SCHEDULER_POSTGRES_MASTER_PORT}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${RUNNER_SCHEDULER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RUNNER_SCHEDULER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RUNNER_SCHEDULER_POSTGRES_DB}
    volumes:
      - runner_scheduler_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  init-scenario-api:
    container_name: init-scenario-api
    build:
      context: ./SAGA/init_scenario_api
      dockerfile: deploy/api.Dockerfile
    env_file:
      - ./SAGA/init_scenario_api/app.env
    environment:
      API_PORT: ${INIT_SCENARIO_API_PORT:-3000}
      DB_HOST: ${INIT_SCENARIO_POSTGRES_HOST:-init-scenario-postgres}
      DB_PORT: ${INIT_SCENARIO_POSTGRES_PORT:-5432}
      DB_USER: ${INIT_SCENARIO_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${INIT_SCENARIO_POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${INIT_SCENARIO_POSTGRES_DB:-postgres}
      KAFKA_BROKERS: ${INIT_SCENARIO_KAFKA_BROKERS:-kafka1:9092,kafka2:9092,kafka3:9092}
      KAFKA_USERNAME: ${INIT_SCENARIO_KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${INIT_SCENARIO_KAFKA_PASSWORD:-}
      KAFKA_ANSWERS_TOPIC: ${INIT_SCENARIO_KAFKA_ANSWERS_TOPIC:-answers}
      KAFKA_RESULTS_TOPIC: ${INIT_SCENARIO_KAFKA_RESULTS_TOPIC:-results}
    volumes:
      - ./SAGA/init_scenario_api/app.env:/app/app.env:ro
    ports:
      - "${INIT_SCENARIO_API_PORT:-3000}:3000"
    depends_on:
      - init-scenario-postgres
    networks:
      - default
      - kafka-net
    restart: unless-stopped

  init-scenario-producer:
    container_name: init-scenario-producer
    build:
      context: ./SAGA/init_scenario_api
      dockerfile: deploy/producer.Dockerfile
    env_file:
      - ./SAGA/init_scenario_api/app.env
    environment:
      PRODUCER_PORT: ${INIT_SCENARIO_PRODUCER_PORT:-3001}
      DB_HOST: ${INIT_SCENARIO_POSTGRES_HOST:-init-scenario-postgres}
      DB_PORT: ${INIT_SCENARIO_POSTGRES_PORT:-5432}
      DB_USER: ${INIT_SCENARIO_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${INIT_SCENARIO_POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${INIT_SCENARIO_POSTGRES_DB:-postgres}
      KAFKA_BROKERS: ${INIT_SCENARIO_KAFKA_BROKERS:-kafka1:9092,kafka2:9092,kafka3:9092}
      KAFKA_USERNAME: ${INIT_SCENARIO_KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${INIT_SCENARIO_KAFKA_PASSWORD:-}

    volumes:
      - ./SAGA/init_scenario_api/app.env:/app/app.env:ro
    ports:
      - "${INIT_SCENARIO_PRODUCER_PORT:-3001}:3001"
    depends_on:
      - init-scenario-postgres
    networks:
      - default
      - kafka-net
    restart: unless-stopped

  runner-scheduler-consumer:
    container_name: runner-scheduler-consumer
    build:
      context: ./SAGA/runner_scheduler
      dockerfile: deploy/consumer.Dockerfile
    environment:
      DB_HOST: ${RUNNER_SCHEDULER_POSTGRES_HOST:-runner-scheduler-postgres}
      DB_PORT: 5432
      DB_USER: ${RUNNER_SCHEDULER_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${RUNNER_SCHEDULER_POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${RUNNER_SCHEDULER_POSTGRES_DB:-runner_scheduler}
      KAFKA_BROKERS: ${RUNNER_SCHEDULER_KAFKA_BROKERS:-kafka1:9092,kafka2:9092,kafka3:9092}
      KAFKA_USERNAME: ${RUNNER_SCHEDULER_KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${RUNNER_SCHEDULER_KAFKA_PASSWORD:-}
      KAFKA_CONSUMER_GROUP: ${RUNNER_SCHEDULER_KAFKA_CONSUMER_GROUP:-runner_scheduler_group}
      KAFKA_INBOX_INFERENCE_TOPIC: ${RUNNER_SCHEDULER_KAFKA_INBOX_INFERENCE_TOPIC:-inbox_inference}
    depends_on:
      - runner-scheduler-postgres
    networks:
      - default
      - kafka-net
    restart: unless-stopped

  runner-scheduler:
    container_name: runner-scheduler
    build:
      context: ./SAGA/runner_scheduler
      dockerfile: deploy/scheduler.Dockerfile
    environment:
      DB_HOST: ${RUNNER_SCHEDULER_POSTGRES_HOST:-runner-scheduler-postgres}
      DB_PORT: 5432
      DB_USER: ${RUNNER_SCHEDULER_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${RUNNER_SCHEDULER_POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${RUNNER_SCHEDULER_POSTGRES_DB:-runner_scheduler}
    depends_on:
      - runner-scheduler-postgres
    networks:
      - default
      - kafka-net
    restart: unless-stopped

  rtsp-inference:
    container_name: rtsp-inference
    build:
      context: ./RTSP_PROCESSING/inference
      dockerfile: Dockerfile
    ports:
      - "${INFERENCE_GRPC_PORT:-50051}:50051"
    networks:
      - default
    restart: unless-stopped



networks:
  kafka-net:
    driver: bridge

volumes:
  kafka1-data:
    driver: local
  kafka2-data:
    driver: local
  kafka3-data:
    driver: local
  init_scenario_postgres_data:
  runner_postgres_data:
  runner_scheduler_postgres_data:
