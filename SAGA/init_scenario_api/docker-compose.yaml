version: '3.8'

services:
  api:
    container_name: init-scenario-api
    build:
      context: .
      dockerfile: ./deploy/api.Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./app.env:/app/app.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app-network

  producer:
    container_name: producer
    build:
      context: .
      dockerfile: ./deploy/producer.Dockerfile
    ports:
      - "${PRODUCER_PORT:-3001}:3001"
    volumes:
      - ./app.env:/app/app.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: init-scenario-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  migrations:
    image: golang:1.24-alpine
    container_name: init-scenario-migrations
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_DSN=postgres://${DB_USER:-user}:${DB_PASSWORD:-password}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-db}?sslmode=disable
    volumes:
      - ./migrations:/app/migrations:ro
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache git &&
        go install github.com/pressly/goose/v3/cmd/goose@latest &&
        goose -dir /app/migrations postgres \"$DB_DSN\" up
      "
    networks:
      - app-network
    restart: "no"

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
